[project]
name = "modernizeops"
version = "0.1.0"
description = "ModernizeOps: RAG- and MCP-powered toolkit for legacy system modernization."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]",
    "chromadb",
    "ollama",
    "rank-bm25",
    "python-docx",
    "openpyxl",
    "pydantic",
    "jsonschema",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone", "rag", "mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
